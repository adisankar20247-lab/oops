version: '3.8'

services:
  app:
    build: .
    container_name: website-scanner-app
    ports:
      - "${PORT:-8080}:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=mysql
      - DB_HOST=db
      - DB_PORT=3306
      - DB_NAME=websitescanner
      - DB_USER=scanner_user
      - DB_PASS=scanner_secret
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mysql:8.0
    container_name: website-scanner-db
    environment:
      MYSQL_ROOT_PASSWORD: root_secret
      MYSQL_DATABASE: websitescanner
      MYSQL_USER: scanner_user
      MYSQL_PASSWORD: scanner_secret
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_secret"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  mysql_data:
