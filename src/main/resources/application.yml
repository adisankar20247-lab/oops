server:
  port: ${PORT:8080}

spring:
  application:
    name: website-scanner
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:h2}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
    show-sql: false

scanner:
  connection-timeout-ms: 8000
  read-timeout-ms: 8000
  max-redirects: 5
  max-response-size-bytes: 2097152 # 2 MB
  max-links-to-scan: 50
  user-agent: "Mozilla/5.0 (compatible; SecurityScannerBot/1.0; +https://example.com/bot)"

---
# MySQL Profile for Production / Local MySQL Database
spring:
  config:
    activate:
      on-profile: mysql
  datasource:
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:websitescanner}?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: ${DB_USER:root}
    password: ${DB_PASS:root}
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    database-platform: org.hibernate.dialect.MySQLDialect

---
# Embedded H2 Profile for Out-of-the-Box Zero-Setup Local Execution
spring:
  config:
    activate:
      on-profile: h2
  datasource:
    url: jdbc:h2:mem:websitescanner;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE;MODE=MySQL
    username: sa
    password:
    driver-class-name: org.h2.Driver
  h2:
    console:
      enabled: true
      path: /h2-console
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect
